  // ---- Depth zones: what lives where ------------------------------------

  drawDeep(ctx, vw, vh, prog, lum, tone) {
    const A = this.band(prog, 0.7, 0.86, 2, 3); if (A <= 0.01 || !this.deep) return;
    const t = this.time, D = this.deep;
    const line = (pts, w) => { ctx.lineWidth = w; ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke(); };
    ctx.save(); const aBase = ctx.globalAlpha; ctx.globalAlpha *= A; ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    // DUMBO OCTOPUS (Grimpoteuthis): a soft bell-shaped mantle with two ear-like
    // fins near the top, big dark eyes, and eight arms joined by an umbrella of
    // webbing that ends in curled arm tips. It hovers by flapping the fins.
    for (const d of D.dumbos) {
      const s = 26 * d.s, flap = Math.sin(d.ph * 2.2), open = 0.5 + 0.5 * Math.sin(d.ph * 1.1);
      ctx.save(); ctx.translate(d.x, d.y);
      ctx.fillStyle = tone(0.68, 0.7);

        ctx.save(); ctx.translate(side * s * 0.36, -s * 0.72); ctx.rotate(side * (0.2 + flap * 0.4));
        ctx.beginPath(); ctx.ellipse(side * s * 0.26, -s * 0.04, s * 0.3, s * 0.15, side * -0.3, 0, Math.PI * 2); ctx.fill();
        ctx.restore();

      ctx.beginPath(); ctx.ellipse(0, -s * 0.5, s * 0.48, s * 0.5, 0, 0, Math.PI * 2); ctx.fill();
      // umbrella of webbing between eight arms, flaring with each swim stroke
      const R = s * (0.78 + open * 0.22), tipY = s * (0.42 + open * 0.05);
      const tips = []; for (let k = 0; k <= 7; k++) { const u = k / 7; tips.push([(u - 0.5) * 2 * R, tipY + Math.sin(u * Math.PI) * s * 0.08 + Math.sin(d.ph * 2 + k) * 1.5]); }
      ctx.beginPath(); ctx.moveTo(-s * 0.46, -s * 0.36);
      ctx.quadraticCurveTo(-R * 0.9, -s * 0.05, tips[0][0], tips[0][1]);
      for (let k = 1; k < tips.length; k++) { const [x0, y0] = tips[k - 1], [x1, y1] = tips[k]; ctx.quadraticCurveTo((x0 + x1) / 2, Math.min(y0, y1) - s * 0.13, x1, y1); }
      ctx.quadraticCurveTo(R * 0.9, -s * 0.05, s * 0.46, -s * 0.36); ctx.closePath(); ctx.fill();

      ctx.strokeStyle = tone(0.68, 0.7);
      tips.forEach(([x, y], k) => { const side = x < 0 ? -1 : 1; line([[x, y], [x + side * 1.5, y + 4], [x + side * 4, y + 4.5]], 1.3); });
      // big dark eyes on the lower mantle
      ctx.fillStyle = tone(0.12, 0.95);
      for (const side of [-1, 1]) { ctx.beginPath(); ctx.ellipse(side * s * 0.21, -s * 0.36, s * 0.11, s * 0.13, 0, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = tone(0.92, 0.9);

      ctx.restore();
    }

    // GULPER EEL (Eurypharynx): a tiny head with a pin-prick eye at the very front,
    // a thin hinged upper jaw over an enormous loose pouch of a lower jaw, and a
    // long whip of a body with a low fin along the back and a glowing tail tip.
    const g = D.gulper;
    ctx.save(); ctx.translate(g.x, g.y); ctx.scale(g.dir, 1);
    ctx.strokeStyle = tone(0.5, 0.7);
    let px = -14, py = 0; const spine = [];
    for (let k = 1; k <= 28; k++) {

      ctx.strokeStyle = tone(0.66 - u * 0.32, 0.95); ctx.lineWidth = 8 * (1 - u) ** 1.3 + 1.4; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, y); ctx.stroke(); px = x; py = y; spine.push([x, y, u]);
    }
    ctx.strokeStyle = tone(0.4, 0.55);

    g.tipX = g.x + px * g.dir; g.tipY = g.y + py;
    const gape = 0.5 + 0.5 * Math.sin(g.ph * 0.6);
    ctx.fillStyle = tone(0.42, 0.9);
    ctx.beginPath(); ctx.moveTo(-14, 4); ctx.bezierCurveTo(4, 20 + gape * 14, 30, 22 + gape * 12, 46, 4 + gape * 3); ctx.lineTo(44, 1); ctx.bezierCurveTo(26, 8, 6, 8, -14, -3); ctx.closePath(); ctx.fill();
    ctx.fillStyle = tone(0.7, 0.95);
    ctx.beginPath(); ctx.moveTo(-16, -5); ctx.quadraticCurveTo(-6, -11, 2, -6); ctx.lineTo(2, 2); ctx.quadraticCurveTo(-8, 5, -16, 4); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = tone(0.62, 0.75); line([[0, -5], [24, -4 - gape * 6], [46, -2 - gape * 2]], 2);
    ctx.fillStyle = tone(0.1, 0.95); ctx.fillRect(-2, -5, 2.2, 2.2);
    ctx.restore();

    // GIANT ISOPOD (Bathynomus): a supersized pill bug. Separate overlapping armour
    // plates, a big dark compound eye, one long and one short antenna, a spiny tail
    // fan, and seven pairs of legs paddling underneath.

    const Ab = this.band(prog, 0.92, 0.99, 2, 3); ctx.globalAlpha = aBase * Ab;
    for (const p of D.isopods) {
      const s = 34 * p.s, y = this.floorY(p.x, vh) - 6;
      ctx.save(); ctx.translate(p.x, y); ctx.scale(p.dir, 1);
      ctx.strokeStyle = tone(0.42, 0.65);
      for (let k = 0; k < 7; k++) { const lx = -s * 0.62 + k * s * 0.2, sw = Math.sin(p.ph + k * 0.9) * 2.5; line([[lx, -1], [lx + 2 + sw, 4], [lx + sw, 7]], 1.5); }
      ctx.fillStyle = tone(0.5, 0.65);
      ctx.beginPath(); ctx.moveTo(-s * 0.95, -1); ctx.quadraticCurveTo(-s * 1.2, -s * 0.18, -s * 1.08, -s * 0.3); ctx.lineTo(-s * 0.8, -s * 0.24); ctx.closePath(); ctx.fill();

      ctx.fillStyle = tone(0.1, 0.95); ctx.beginPath(); ctx.ellipse(s * 0.96, -s * 0.2, 3.2, 2.6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = tone(0.55, 0.7);
      line([[s * 1.05, -s * 0.26], [s * 1.35, -s * 0.5], [s * 0.9, -s * 0.62 + Math.sin(p.ph * 0.3) * 2], [s * 0.2, -s * 0.66]], 1.3);

    // TRIPOD FISH (Bathypterois): a long, tapered dark fish perched off the bottom
    // on two stiff pelvic rays and the lower ray of its tail, nose into the current,
    // with feeler-like pectoral fins swept forward over its head.
    for (const f of D.tripods) {
      const y0 = this.floorY(f.x, vh) + 2, h = 48 + Math.sin(f.ph) * 1.2;

      ctx.strokeStyle = tone(0.55, 0.7);

      line([[1, -h + 4], [2, -h * 0.5], [4, 0]], 1.4);
      line([[-34, -h + 2], [-38, -h * 0.45], [-44, 0]], 1.4);
      if (lum) { const gr = ctx.createLinearGradient(0, -h - 9, 0, -h + 6); gr.addColorStop(0, this.g(0.76)); gr.addColorStop(1, this.g(0.4)); ctx.fillStyle = gr; } else ctx.fillStyle = tone(0.46, 0.7);
      ctx.beginPath(); ctx.moveTo(24, -h - 1); ctx.quadraticCurveTo(18, -h - 9, 4, -h - 7); ctx.quadraticCurveTo(-18, -h - 4, -36, -h + 1); ctx.quadraticCurveTo(-16, -h + 6, 4, -h + 5); ctx.quadraticCurveTo(18, -h + 5, 24, -h - 1); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-34, -h + 1); ctx.lineTo(-42, -h - 5); ctx.lineTo(-40, -h + 3); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-6, -h - 6); ctx.lineTo(-12, -h - 12); ctx.lineTo(-16, -h - 5); ctx.closePath(); ctx.fill();
      ctx.fillStyle = tone(0.1, 0.95); ctx.fillRect(17, -h - 4, 2, 2);
      ctx.strokeStyle = tone(0.6, 0.75);

    // YETI CRAB (Kiwa): a pale, eyeless squat lobster. Long oval carapace with the
    // tail tucked beneath, long forward-reaching claws covered in dense silky

    // pair of antennae.

      ctx.beginPath(); ctx.ellipse(0, -6.5, 8.5, 4.2, -0.05, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = tone(0.88, 0.9); ctx.beginPath(); ctx.ellipse(1.5, -8.6, 4.5, 1.2, -0.05, 0, Math.PI * 2); ctx.fill();

  }

  // The abyssal floor: one continuous, gently uneven sediment surface across the
  // whole width, with mineral mounds built up around each vent.
  floorY(x, vh) {
    let h = 26 + 10 * Math.sin(x * 0.0042 + 1.3) + 7 * Math.sin(x * 0.011 + 0.4) + 3 * Math.sin(x * 0.031 + 2);
    if (this.vents) for (const v of this.vents) h += (v.kind === 'beehive' ? 14 : 22) * Math.exp(-(((x - v.x) / 85) ** 2));
    return vh - h;
  }

  drawFloor(ctx, vw, vh, lum, tone) {
    if (!this.rocks) {
      this.rocks = [];
      for (let i = 0; i < 16; i++) this.rocks.push({ x: Math.random() * vw, w: 6 + Math.random() * 16, h: 4 + Math.random() * 8 });
    }
    const top = [];
    for (let x = -10; x <= vw + 10; x += 10) top.push([x, this.floorY(x, vh)]);
    ctx.fillStyle = tone(0.26, 0.45);
    ctx.beginPath(); ctx.moveTo(-10, vh + 6); for (const [x, y] of top) ctx.lineTo(x, y); ctx.lineTo(vw + 10, vh + 6); ctx.closePath(); ctx.fill();
    // a lighter crust along the top edge, then a second darker band for depth
    ctx.strokeStyle = tone(0.42, 0.6); ctx.lineWidth = 3; ctx.lineJoin = 'round';
    ctx.beginPath(); top.forEach(([x, y], i) => (i ? ctx.lineTo(x, y + 1) : ctx.moveTo(x, y + 1))); ctx.stroke();
    ctx.strokeStyle = tone(0.2, 0.35); ctx.lineWidth = 6;
    ctx.beginPath(); top.forEach(([x, y], i) => (i ? ctx.lineTo(x, y + 14 + Math.sin(x * 0.05) * 2) : ctx.moveTo(x, y + 14))); ctx.stroke();
    ctx.fillStyle = tone(0.36, 0.55);
    for (const r of this.rocks) { const y = this.floorY(r.x, vh); ctx.beginPath(); ctx.ellipse(r.x, y + 1, r.w * 0.5, r.h * 0.5, 0, Math.PI, 0); ctx.fill(); }
  }

  drawKelp(ctx, vw, vh, prog, style, width) {
    const t = this.time, kelpA = Math.max(0, 1 - prog * 2.6);
    if (kelpA <= 0) return;
    ctx.save(); ctx.strokeStyle = style; ctx.globalAlpha *= kelpA; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const k of this.kelp) {

      for (let s = 1; s <= 10; s++) ctx.lineTo(k.x + Math.sin(t * 0.8 + k.ph + s * 0.5) * s * 3.5, vh - (k.h * s) / 10);
      ctx.stroke();
      // a few blades off the stalk
      for (let s = 3; s <= 9; s += 2) {
        const bx = k.x + Math.sin(t * 0.8 + k.ph + s * 0.5) * s * 3.5, by = vh - (k.h * s) / 10, side = s % 4 === 1 ? 1 : -1;
        ctx.lineWidth = width * 0.7; ctx.beginPath(); ctx.moveTo(bx, by);
        ctx.quadraticCurveTo(bx + side * 14, by - 6, bx + side * 22 + Math.sin(t + s) * 3, by + 4); ctx.stroke();
      }
    }
    ctx.restore();
  }

  // The manta in its own local space (centre at 0,0, facing +x).
  paintManta(ctx, lum, tone, plain) {
    const m = this.manta, W = m.W, f = Math.sin(m.ph) * W * 0.12;
    if (plain) ctx.fillStyle = '#fff';
    else if (lum) {
      const sh = ctx.createRadialGradient(W * 0.05, 0, W * 0.04, 0, 0, W * 0.52);
      sh.addColorStop(0, this.g(0.78)); sh.addColorStop(0.45, this.g(0.58)); sh.addColorStop(1, this.g(0.3));

    ctx.quadraticCurveTo(W * 0.1, W * 0.2, -W * 0.06 + f * 0.3, W * 0.5 + f);
    ctx.quadraticCurveTo(-W * 0.08, W * 0.2, -W * 0.22, W * 0.04);
    ctx.lineTo(-W * 0.22, -W * 0.04);
    ctx.quadraticCurveTo(-W * 0.08, -W * 0.2, -W * 0.06 + f * 0.3, -W * 0.5 - f);
    ctx.quadraticCurveTo(W * 0.1, -W * 0.2, W * 0.24, -W * 0.05);
    ctx.fill();
    ctx.strokeStyle = plain ? '#fff' : tone ? tone(0.45, 0.8) : this.g(0.45); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-W * 0.22, 0); ctx.quadraticCurveTo(-W * 0.4, Math.sin(m.ph * 1.3) * 8, -W * 0.55, 0); ctx.stroke();
  }

  // Dithers the manta in its own space, so the pattern rides along with it
  // instead of the manta sliding across a screen-fixed pattern (which shimmers).

      const i = (y * sw + x) * 4, al = d[i + 3];

    c2.imageSmoothingEnabled = false; c2.drawImage(sp, 0, 0, fw, fh);

    const c3 = mk.getContext('2d'); c3.setTransform(1, 0, 0, 1, 0, 0); c3.clearRect(0, 0, fw, fh);
    c3.setTransform(m.dir, 0, 0, 1, fw / 2, fh / 2); this.paintManta(c3, false, null, true);
    c2.globalCompositeOperation = 'destination-in'; c2.setTransform(1, 0, 0, 1, 0, 0); c2.drawImage(mk, 0, 0);

  }

  drawDeepGlow(ctx, prog, pal) {
    const A = this.band(prog, 0.7, 0.86, 2, 3), g = this.deep && this.deep.gulper;
    if (A <= 0.01 || !g || g.tipX === undefined) return;
    const b = (0.6 + 0.4 * Math.sin(this.time * 4)) * A;
